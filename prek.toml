[update]
cooldown_days = 7

# ruff
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "c0f278f1254ccc8fb09676bcdb8d847e7db493e5"                          # frozen: v0.17.4
hooks = [{ id = "ruff-check", args = ["--fix"] }, { id = "ruff-format" }]

# uv
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "d1df990f871e616da38bb602a2671d5e840b9989"    # frozen: 0.13.7
hooks = [{ id = "uv-audit" }, { id = "uv-lock" }]

# zizmor
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "06a39750ec31860bb44f2acf67182c40016cd1e7"             # frozen: v1.32.0
hooks = [{ id = "zizmor", args = ["--persona", "auditor"] }]

# commitizen
[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "f690817de25831a37094ca35af5ada05c909ff1c"        # frozen: v4.19.3
hooks = [{ id = "commitizen", stages = ["pre-push"] }]

# ty
[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "c7c033957b32915cd7f904e97be28de58f572300"    # frozen: v0.0.99
hooks = [{ id = "ty" }]
